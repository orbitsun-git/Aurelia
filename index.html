<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aurelia · 학습 공간</title>

  <link rel="stylesheet" href="css/style.css?v=link-only-r5">
  <link rel="stylesheet" href="css/update.css?v=link-only-r5">
  <link rel="stylesheet" href="css/board-brand.css?v=bookshop-r8">
  <link rel="stylesheet" href="css/resources.css?v=link-only-r5">
  <link rel="stylesheet" href="css/admin-panel.css?v=link-only-r5">
</head>

<body>
  <header>
    <div class="top">
      <button class="brand" data-page="home">
        <svg width="36" height="36" aria-hidden="true" focusable="false" style="display:block;flex:none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><rect x="1" y="1" width="46" height="46" rx="14" fill="#f9f3e7" stroke="#e9dcc6"/><ellipse cx="24" cy="25" rx="18" ry="8.5" transform="rotate(-27 24 25)" fill="none" stroke="#ac8850" stroke-width="1.15"/><path d="M24 20c-4-4-9-5-13-4v14c5-1 9 0 13 4 4-4 8-5 13-4V16c-4-1-9 0-13 4Z" fill="#fffdf7" stroke="#354b41" stroke-width="1.65" stroke-linejoin="round"/><path d="M24 20v14" stroke="#354b41" stroke-width="1.5"/><path d="M36 8l1.2 3.5 3.5 1.2-3.5 1.2-1.2 3.5-1.2-3.5-3.5-1.2 3.5-1.2z" fill="#ac8850"/></svg> <span class="brand-wordmark">Aurelia</span>
      </button>
      <span class="preview">AURELIA · LEARNING SPACE</span>
    </div>

    <nav class="nav">
      <button class="major" data-course="내신">내신</button>
      
      <button class="push" data-page="store">문제집 서점</button>
      <button data-page="community">게시판</button>
    </nav>
  </header>

  <div id="filters" class="filters">
    <div class="filterinner">
      <span class="quiet">학년 · 학기</span>

      <select id="grade" aria-label="학년">
        <option>1학년</option>
        <option selected>2학년</option>
        <option>3학년</option>
      </select>

      <select id="semester" aria-label="학기">
        <option>1학기</option>
        <option selected>2학기</option>
      </select>

      <span class="quiet">
        과목을 선택하면 Aurelia로 이동합니다.
      </span>
    </div>

    <div class="subjectnav" id="subjects"></div>
  </div>

  <main id="app"></main>

  <dialog id="modal">
    <button class="close" aria-label="닫기">×</button>
    <div id="modalcontent"></div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=link-only-r5"></script>
  <script src="js/gallery.js?v=gallery3"></script><script src="js/backend.js?v=link-only-r5"></script>
  <script src="js/main.js?v=clover-native-r3"></script>
  <script src="js/update.js?v=link-only-r5"></script>
  <script src="js/resources.js?v=gallery3-link-only-r5"></script>
  <script src="js/admin-panel.js?v=gallery3-cover1-link-only-r5"></script>
<script src="js/drive-pdf.js?v=link-only-r5"></script><script src="js/themes77.js?v=clover-playlist-r7"></script>
<script src="js/final-update.js?v=bookshop-r8"></script>
</body>
</html>
