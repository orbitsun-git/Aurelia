<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>학습 공간 · 과목 선택</title>

  <style>
    :root {
      --background: #fcfbf7;
      --card: #ffffff;
      --gold: #a17b19;
      --dark-gold: #775b12;
      --border: #e2d7b5;
      --text: #393329;
      --muted: #766e5b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        "Segoe UI",
        "Nanum Gothic",
        sans-serif;
      line-height: 1.6;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button,
    a,
    input,
    select {
      outline-offset: 4px;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
    }

    [hidden] {
      display: none !important;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 24px 32px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      margin: 0;
      color: var(--dark-gold);
      font-size: 25px;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .container {
      max-width: 1100px;
      margin: 32px auto;
      padding: 0 20px 40px;
    }

    .semester-tools {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 28px;
      padding: 18px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .semester-tools label {
      color: var(--dark-gold);
      font-weight: 700;
      white-space: nowrap;
    }

    select,
    input {
      padding: 11px 13px;
      color: var(--text);
      background: #ffffff;
      border: 1px solid #d8cfba;
      border-radius: 10px;
    }

    #semester {
      min-width: 180px;
    }

    .add-subject-button {
      padding: 10px 14px;
      color: #705511;
      background: #fffdf5;
      border: 1px solid #ceb260;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .add-subject-button:hover:not(:disabled) {
      background: #fff5d9;
    }

    .add-subject-button:disabled {
      opacity: 0.55;
    }

    #subject-count {
      margin-left: auto;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .page-title {
      margin: 0 0 22px;
      color: #66552d;
      font-size: 25px;
    }

    #notice {
      color: #98472d;
      font-size: 14px;
    }

    #notice:empty {
      display: none;
    }

    /* PC: 한 줄에 3과목 */
    .subject-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
      align-items: stretch;
    }

    .subject-card {
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow:
        0 4px 15px rgba(115, 88, 20, 0.06);
    }

    .subject-link {
      display: block;
      color: inherit;
      text-decoration: none;
    }

    .subject-art {
      display: grid;
      place-items: center;
      height: 135px;
      background: var(--symbol-background, #f2f5eb);
    }

    .subject-symbol {
      color: #645438;
      font-size: 48px;
      font-weight: 700;
      line-height: 1;
      transition: transform 0.2s ease;
    }

    .subject-link:hover .subject-symbol {
      transform: translateY(-4px);
    }

    .subject-name {
      margin: 18px 20px 12px;
      font-size: 19px;
      overflow-wrap: anywhere;
    }

    .theme-button {
      margin: 0 18px 18px;
      padding: 8px 11px;
      color: #746441;
      background: #f5f1e8;
      border: none;
      border-radius: 9px;
      font-size: 12px;
      text-align: left;
    }

    .theme-button:hover {
      background: #ece5d6;
    }

    .storage-note {
      margin-top: 24px;
      color: var(--muted);
      font-size: 13px;
    }

    dialog {
      width: min(450px, 92vw);
      max-height: 90vh;
      overflow-y: auto;
      padding: 26px;
      color: var(--text);
      background: #fffdf8;
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    dialog::backdrop {
      background: rgba(32, 29, 23, 0.42);
    }

    dialog h2 {
      margin-top: 0;
      color: var(--dark-gold);
      font-size: 23px;
    }

    dialog label {
      display: block;
      margin: 16px 0 7px;
      font-size: 14px;
      font-weight: 700;
    }

    dialog input,
    dialog select {
      width: 100%;
    }

    .dialog-note {
      color: var(--muted);
      font-size: 13px;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 22px;
    }

    .button {
      padding: 10px 16px;
      color: #ffffff;
      background: var(--gold);
      border: none;
      border-radius: 9px;
      font-weight: 700;
    }

    .button-secondary {
      color: #4d493e;
      background: #eeede8;
    }

    /* 작은 화면: 한 줄에 2과목 */
    @media (max-width: 700px) {
      header {
        padding: 20px;
      }

      header h1 {
        font-size: 22px;
      }

      .container {
        margin-top: 20px;
        padding-right: 16px;
        padding-left: 16px;
      }

      .semester-tools {
        gap: 10px;
        padding: 15px;
      }

      #semester {
        min-width: 0;
        flex: 1;
      }

      .add-subject-button {
        padding: 10px 12px;
        font-size: 12px;
      }

      #subject-count {
        width: 100%;
        margin-left: 0;
      }

      .subject-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .subject-art {
        height: 112px;
      }

      .subject-symbol {
        font-size: 39px;
      }

      .subject-name {
        margin: 14px 13px 10px;
        font-size: 16px;
      }

      .theme-button {
        margin: 0 10px 13px;
        padding: 7px;
        font-size: 11px;
      }
    }

    @media (max-width: 350px) {
      .subject-grid {
        grid-template-columns: 1fr;
      }

      .semester-tools label {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>🍀 학습 공간</h1>
    <p>과목을 선택하고 학습을 시작하세요</p>
  </header>

  <main class="container">
    <div class="semester-tools">
      <label for="semester">학년 · 학기</label>

      <select id="semester"></select>

      <button
        id="add-subject-button"
        class="add-subject-button"
        type="button"
        disabled
      >
        + 과목 추가
      </button>

      <span id="subject-count"></span>
    </div>

    <h2 class="page-title">
      어떤 과목을 공부할까요?
    </h2>

    <p id="notice" role="status"></p>

    <div
      id="subject-grid"
      class="subject-grid"
    ></div>

    <p class="storage-note">
      과목 추가와 테마 선택은 현재 브라우저에 저장됩니다.
      학기당 기존 과목을 포함해 최대 10개입니다.
    </p>
  </main>

  <dialog
    id="add-dialog"
    aria-labelledby="add-heading"
  >
    <h2 id="add-heading">새 과목 추가</h2>
    <p id="add-semester"></p>

    <form id="add-form">
      <label for="subject-name">과목 이름</label>
      <input
        id="subject-name"
        required
        maxlength="40"
        placeholder="예: 물리학"
        autocomplete="off"
      >

      <label for="subject-icon">과목 상징</label>
      <select id="subject-icon">
        <option>📚</option>
        <option>📖</option>
        <option>🔤</option>
        <option>∫</option>
        <option>🧬</option>
        <option>⚗️</option>
        <option>⚖️</option>
        <option>🌍</option>
        <option>⚛️</option>
        <option>💻</option>
        <option>🎨</option>
        <option>🎵</option>
      </select>

      <label for="add-theme">과목 페이지 테마</label>
      <select id="add-theme"></select>

      <p class="dialog-note">
        테마는 과목 페이지에만 적용됩니다.
        홈 화면과 과목 상징의 배경색은 바뀌지 않습니다.
      </p>

      <div class="dialog-actions">
        <button
          class="button button-secondary"
          type="button"
          data-close="add-dialog"
        >
          취소
        </button>

        <button
          class="button"
          type="submit"
        >
          추가하기
        </button>
      </div>
    </form>
  </dialog>

  <dialog
    id="theme-dialog"
    aria-labelledby="theme-heading"
  >
    <h2 id="theme-heading">과목 테마</h2>

    <form id="theme-form">
      <label for="edit-theme">과목 페이지 테마</label>
      <select id="edit-theme"></select>

      <p class="dialog-note">
        홈 화면의 과목 상징 배경색은 고정됩니다.
      </p>

      <div class="dialog-actions">
        <button
          class="button button-secondary"
          type="button"
          data-close="theme-dialog"
        >
          취소
        </button>

        <button
          class="button"
          type="submit"
        >
          저장
        </button>
      </div>
    </form>
  </dialog>

  <script>
    (function () {
      "use strict";

      const MAX_SUBJECTS = 10;

      // 기존 브라우저 데이터를 유지하는 저장 키
      const CUSTOM_KEY = "gold-class-custom-subjects-v1";
      const THEME_KEY = "gold-class-subject-themes-v1";
      const SEMESTER_KEY = "gold-class-selected-semester";

      const SEMESTERS = [
        "1학년 1학기",
        "1학년 2학기",
        "2학년 1학기",
        "2학년 2학기",
        "3학년 1학기",
        "3학년 2학기"
      ];

      const THEMES = {
        ocean: "🌊 바다",
        resort: "🏝️ 휴양지 바다",
        night: "🌙 밤하늘",
        sunset: "🌅 노을",
        city: "🏙️ 도시",
        space: "🪐 우주",
        plane: "✈️ 비행기 창밖"
      };

      const DEFAULT_THEMES = {
        reading: "sunset",
        english2: "plane",
        calculus2: "space",
        genetics: "ocean",
        chemistry: "night",
        ethics: "city"
      };

      const DEFAULT_SEMESTER = "2학년 2학기";

      const BUILTIN_SUBJECTS = {
        reading: {
          name: "독서와작문",
          emoji: "📖",
          semester: DEFAULT_SEMESTER
        },
        english2: {
          name: "영어2",
          emoji: "🔤",
          semester: DEFAULT_SEMESTER
        },
        calculus2: {
          name: "미적분2",
          emoji: "∫",
          semester: DEFAULT_SEMESTER
        },
        genetics: {
          name: "생물의유전",
          emoji: "🧬",
          semester: DEFAULT_SEMESTER
        },
        chemistry: {
          name: "화학",
          emoji: "⚗️",
          semester: DEFAULT_SEMESTER
        },
        ethics: {
          name: "현대사회와윤리",
          emoji: "⚖️",
          semester: DEFAULT_SEMESTER
        }
      };

      // 과목 상징의 배경은 테마와 관계없이 고정됩니다.
      const SUBJECT_VISUALS = {
        reading: {
          symbol: "文",
          background: "#fff3e4"
        },
        english2: {
          symbol: "Aa",
          background: "#eaf3ff"
        },
        calculus2: {
          symbol: "∫",
          background: "#f0ecff"
        },
        genetics: {
          symbol: "🧬",
          background: "#e8f7ed"
        },
        chemistry: {
          symbol: "⚗️",
          background: "#e7f5f7"
        },
        ethics: {
          symbol: "⚖️",
          background: "#fff1e7"
        }
      };

      const $ = (id) => document.getElementById(id);

      let selectedSemester = DEFAULT_SEMESTER;
      let editingSubjectId = null;
      let addingSemester = DEFAULT_SEMESTER;

      function makeElement(tag, text, className) {
        const element = document.createElement(tag);

        if (text !== undefined) {
          element.textContent = text;
        }

        if (className) {
          element.className = className;
        }

        return element;
      }

      function readObject(key) {
        const text = localStorage.getItem(key);

        if (text === null) {
          return {};
        }

        const value = JSON.parse(text);

        if (
          !value ||
          typeof value !== "object" ||
          Array.isArray(value)
        ) {
          throw new Error("저장 데이터 형식을 확인해야 합니다.");
        }

        return value;
      }

      function readCustomSubjects() {
        const raw = readObject(CUSTOM_KEY);
        const result = {};

        Object.entries(raw).forEach(([id, item]) => {
          if (!/^custom_[a-z0-9_]+$/.test(id)) {
            return;
          }

          if (
            !item ||
            typeof item.name !== "string" ||
            !item.name.trim() ||
            item.name.length > 40 ||
            !SEMESTERS.includes(item.semester)
          ) {
            return;
          }

          result[id] = {
            name: item.name.trim(),
            semester: item.semester,
            emoji:
              typeof item.emoji === "string"
                ? item.emoji.slice(0, 16)
                : "📚",
            mascot: "🍀 클로버",
            desc: ""
          };
        });

        return result;
      }

      function readSubjects() {
        return {
          ...BUILTIN_SUBJECTS,
          ...readCustomSubjects()
        };
      }

      function getTheme(id, savedThemes) {
        const stored = savedThemes[id];

        if (
          Object.prototype.hasOwnProperty.call(
            THEMES,
            stored
          )
        ) {
          return stored;
        }

        return DEFAULT_THEMES[id] || "ocean";
      }

      function countSubjects(subjects, semester) {
        return Object.values(subjects).filter(
          (subject) => subject.semester === semester
        ).length;
      }

      function fillThemeOptions(select) {
        Object.entries(THEMES).forEach(([value, label]) => {
          const option = makeElement("option", label);
          option.value = value;
          select.append(option);
        });
      }

      function saveTheme(id, value) {
        if (
          !Object.prototype.hasOwnProperty.call(
            THEMES,
            value
          )
        ) {
          throw new Error("선택할 수 없는 테마입니다.");
        }

        const themes = readObject(THEME_KEY);
        themes[id] = value;

        localStorage.setItem(
          THEME_KEY,
          JSON.stringify(themes)
        );
      }

      function openThemeDialog(id, subject) {
        try {
          editingSubjectId = id;

          $("theme-heading").textContent =
            subject.name + " 테마";

          $("edit-theme").value = getTheme(
            id,
            readObject(THEME_KEY)
          );

          $("theme-dialog").showModal();
        } catch (error) {
          alert(
            "테마를 불러오지 못했습니다: " +
            error.message
          );
        }
      }

      function openAddDialog() {
        try {
          const subjects = readSubjects();

          if (
            countSubjects(subjects, selectedSemester) >=
            MAX_SUBJECTS
          ) {
            alert("이 학기는 이미 10과목이 등록되어 있습니다.");
            render();
            return;
          }

          addingSemester = selectedSemester;

          $("add-form").reset();
          $("add-semester").textContent = addingSemester;
          $("add-theme").value = "ocean";
          $("add-dialog").showModal();
        } catch (error) {
          alert(
            "과목 추가 창을 열지 못했습니다: " +
            error.message
          );
        }
      }

      function render() {
        const grid = $("subject-grid");
        const addButton = $("add-subject-button");

        try {
          const subjects = readSubjects();
          const themes = readObject(THEME_KEY);

          const entries = Object.entries(subjects).filter(
            ([, subject]) =>
              subject.semester === selectedSemester
          );

          grid.replaceChildren();

          $("subject-count").textContent =
            entries.length + " / " + MAX_SUBJECTS + "과목";

          $("notice").textContent =
            entries.length > MAX_SUBJECTS
              ? "기존 과목은 유지했습니다. " +
                "이 학기에는 더 추가할 수 없습니다."
              : "";

          const full = entries.length >= MAX_SUBJECTS;

          addButton.disabled = full;
          addButton.textContent = full
            ? "10과목 등록 완료"
            : "+ 과목 추가";

          entries.forEach(([id, subject]) => {
            const card = makeElement(
              "article",
              undefined,
              "subject-card"
            );

            const link = makeElement(
              "a",
              undefined,
              "subject-link"
            );

            link.href =
              "subject.html?id=" + encodeURIComponent(id);

            const visual = SUBJECT_VISUALS[id] || {
              symbol: subject.emoji || "📚",
              background: "#f2f5eb"
            };

            card.style.setProperty(
              "--symbol-background",
              visual.background
            );

            const art = makeElement(
              "div",
              undefined,
              "subject-art"
            );

            art.setAttribute("aria-hidden", "true");

            art.append(
              makeElement(
                "span",
                visual.symbol,
                "subject-symbol"
              )
            );

            link.append(
              art,
              makeElement(
                "h3",
                subject.name,
                "subject-name"
              )
            );

            const theme = getTheme(id, themes);

            const themeButton = makeElement(
              "button",
              THEMES[theme] + " · 변경",
              "theme-button"
            );

            themeButton.type = "button";

            themeButton.setAttribute(
              "aria-label",
              subject.name + " 테마 변경"
            );

            themeButton.addEventListener(
              "click",
              () => openThemeDialog(id, subject)
            );

            card.append(link, themeButton);
            grid.append(card);
          });

          // 큰 과목 추가 카드는 생성하지 않습니다.
          // 추가 버튼은 상단 학기 선택 옆에만 표시됩니다.
        } catch (error) {
          grid.replaceChildren();
          addButton.disabled = true;

          $("subject-count").textContent = "";

          $("notice").textContent =
            "브라우저 저장 데이터를 읽지 못했습니다. " +
            "저장 데이터를 삭제하지 말고 " +
            "다음 오류를 알려 주세요: " +
            error.message;
        }
      }

      function addSubject(event) {
        event.preventDefault();

        const name = $("subject-name").value.trim();

        if (!name) {
          $("subject-name").focus();
          return;
        }

        try {
          // 저장 직전에 다시 읽어 제한을 검사합니다.
          const custom = readCustomSubjects();

          const subjects = {
            ...BUILTIN_SUBJECTS,
            ...custom
          };

          if (
            countSubjects(subjects, addingSemester) >=
            MAX_SUBJECTS
          ) {
            alert(
              "한 학기에 기존 과목을 포함해 " +
              "최대 10과목까지 추가할 수 있습니다."
            );

            render();
            return;
          }

          const duplicate = Object.values(subjects).some(
            (subject) =>
              subject.semester === addingSemester &&
              subject.name === name
          );

          if (duplicate) {
            alert(
              "이 학기에 같은 이름의 과목이 " +
              "이미 있습니다."
            );
            return;
          }

          const id =
            "custom_" +
            crypto.randomUUID().replaceAll("-", "_");

          const theme = $("add-theme").value;

          // 테마 저장 실패 시 과목을 추가하지 않습니다.
          saveTheme(id, theme);

          custom[id] = {
            name,
            semester: addingSemester,
            emoji: $("subject-icon").value,
            mascot: "🍀 클로버",
            desc: ""
          };

          localStorage.setItem(
            CUSTOM_KEY,
            JSON.stringify(custom)
          );

          $("add-dialog").close();
          render();
        } catch (error) {
          alert(
            "과목을 저장하지 못했습니다: " +
            error.message
          );
        }
      }

      function editTheme(event) {
        event.preventDefault();

        if (!editingSubjectId) {
          return;
        }

        try {
          saveTheme(
            editingSubjectId,
            $("edit-theme").value
          );

          $("theme-dialog").close();
          render();
        } catch (error) {
          alert(
            "테마를 저장하지 못했습니다: " +
            error.message
          );
        }
      }

      function initialize() {
        try {
          const saved = localStorage.getItem(SEMESTER_KEY);

          if (SEMESTERS.includes(saved)) {
            selectedSemester = saved;
          }
        } catch (error) {
          console.warn(
            "선택한 학기를 복원하지 못했습니다.",
            error
          );
        }

        const semesterSelect = $("semester");

        SEMESTERS.forEach((semester) => {
          const option = makeElement("option", semester);
          option.value = semester;
          semesterSelect.append(option);
        });

        semesterSelect.value = selectedSemester;

        semesterSelect.addEventListener("change", () => {
          selectedSemester = semesterSelect.value;

          try {
            localStorage.setItem(
              SEMESTER_KEY,
              selectedSemester
            );
          } catch (error) {
            console.warn(
              "선택한 학기를 저장하지 못했습니다.",
              error
            );
          }

          render();
        });

        fillThemeOptions($("add-theme"));
        fillThemeOptions($("edit-theme"));

        $("add-subject-button").addEventListener(
          "click",
          openAddDialog
        );

        $("add-form").addEventListener(
          "submit",
          addSubject
        );

        $("theme-form").addEventListener(
          "submit",
          editTheme
        );

        document.querySelectorAll(
          "[data-close]"
        ).forEach((button) => {
          button.addEventListener("click", () => {
            $(button.dataset.close).close();
          });
        });

        // 다른 탭에서 바뀐 과목·테마를 반영합니다.
        window.addEventListener("storage", (event) => {
          if (
            event.key === null ||
            event.key === CUSTOM_KEY ||
            event.key === THEME_KEY
          ) {
            render();
          }
        });

        // 과목 페이지에서 홈으로 복귀할 때 갱신합니다.
        window.addEventListener("pageshow", render);
        window.addEventListener("focus", render);

        document.addEventListener(
          "visibilitychange",
          () => {
            if (!document.hidden) {
              render();
            }
          }
        );

        render();
      }

      initialize();
    })();
  </script>
</body>
</html>
