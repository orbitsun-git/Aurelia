<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aurelia · 학습 공간</title>

  <link rel="stylesheet" href="css/style.css?v=link-only-r5">
  <link rel="stylesheet" href="css/update.css?v=link-only-r5">
  <link rel="stylesheet" href="css/board-brand.css?v=link-only-r5">
  <link rel="stylesheet" href="css/resources.css?v=link-only-r5">
  <link rel="stylesheet" href="css/admin-panel.css?v=link-only-r5">
</head>

<body>
  <header>
    <div class="top">
      <button class="brand" data-page="home">
        <span>▰</span> Aurelia
      </button>
      <span class="preview">AURELIA · LEARNING SPACE</span>
    </div>

    <nav class="nav">
      <button class="major" data-course="내신">내신</button>
      
      <button class="push" data-page="store">수능</button>
      <button data-page="community">게시판</button>
    </nav>
  </header>

  <div id="filters" class="filters">
    <div class="filterinner">
      <span class="quiet">학년 · 학기</span>

      <select id="grade" aria-label="학년">
        <option>1학년</option>
        <option selected>2학년</option>
        <option>3학년</option>
      </select>

      <select id="semester" aria-label="학기">
        <option>1학기</option>
        <option selected>2학기</option>
      </select>

      <span class="quiet">
        과목을 선택하면 Aurelia로 이동합니다.
      </span>
    </div>

    <div class="subjectnav" id="subjects"></div>
  </div>

  <main id="app"></main>

  <dialog id="modal">
    <button class="close" aria-label="닫기">×</button>
    <div id="modalcontent"></div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=link-only-r5"></script>
  <script src="js/gallery.js?v=gallery3"></script><script src="js/backend.js?v=link-only-r5"></script>
  <script src="js/main.js?v=link-only-r5"></script>
  <script src="js/update.js?v=link-only-r5"></script>
  <script src="js/resources.js?v=gallery3-link-only-r5"></script>
  <script src="js/admin-panel.js?v=gallery3-cover1-link-only-r5"></script>
<script src="js/drive-pdf.js?v=link-only-r5"></script><script src="js/themes77.js?v=100-preview-r7"></script>
<script src="js/final-update.js?v=semester-csat-1"></script>
</body>
</html>
